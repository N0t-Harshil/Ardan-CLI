[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardan"
version = "0.2.0"
description = "Ardan - a multi-provider autonomous coding agent CLI (Planner / Executor / Reviewer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "cryptography>=42.0",
    "beautifulsoup4>=4.12",
    "watchdog>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
google = ["google-generativeai>=0.8.0"]
all = ["anthropic>=0.40.0", "google-generativeai>=0.8.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ardan = "ardan.main:app"

[tool.setuptools.packages.find]
include = ["ardan*"]

[tool.pytest.ini_options]
testpaths = ["ardan/tests"]
