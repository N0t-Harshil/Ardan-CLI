# Ardan configuration.
# Keys set via `ardan keys set <provider>` or <PROVIDER>_API_KEY env vars take
# precedence over config below. Provider settings here are merged in.

ardan:
  # ollama | anthropic | google | openai | mistral | groq | openrouter
  default_provider: ollama

# Per-provider configuration. `model` becomes the provider's default model.
providers:
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5-coder:14b
    temperature: 0.2
    num_ctx: 8192
    stream: true

  anthropic:
    model: claude-sonnet-4-5
    temperature: 0.2
    max_tokens: 8096
    stream: true

  google:
    model: gemini-2.5-flash
    temperature: 0.2
    max_tokens: 8096
    stream: true

  openai:
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 8096
    stream: true

  mistral:
    model: codestral-latest
    temperature: 0.2
    max_tokens: 8096
    stream: true

  groq:
    model: llama-3.3-70b-versatile
    temperature: 0.2
    max_tokens: 8096
    stream: true

  openrouter:
    model: deepseek/deepseek-chat
    temperature: 0.2
    max_tokens: 8096
    stream: true
    site_url: https://github.com/ardan-cli
    app_name: Ardan

agent:
  workspace: ./ardan-output
  max_steps: 40                # hard cap on plan steps executed per run
  max_turns_per_step: 5        # ReAct turns per step before giving up
  auto_confirm: false          # skip the "Proceed?" prompt for plans
  auto_failover: true          # fall through to failover_chain on provider errors
  failover_chain: [groq, openrouter, ollama]
  auto_fix_errors: true        # run the reviewer/fixer pass after every build
  multi_pass_review: true

ui:
  show_raw_llm_output: false   # print raw model text while a step executes
  show_provider_badge: true
  theme: dark

# Optional MCP servers the executor can call as tools.
# Example:
#   servers:
#     files:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
mcp:
  servers: {}
